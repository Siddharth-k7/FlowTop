# Local development database only. Staging and production use managed Postgres (see infra/).
#
#   docker compose up -d
#   DATABASE_URL=postgresql://flowtop:flowtop@localhost:5433/flowtop
#
# Host port 5433, not 5432, so it does not collide with another local Postgres.
# Override with FLOWTOP_DB_PORT if 5433 is taken too.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowtop
      POSTGRES_PASSWORD: flowtop
      POSTGRES_DB: flowtop
    ports:
      - '${FLOWTOP_DB_PORT:-5433}:5432'
    volumes:
      - flowtop-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowtop -d flowtop']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  flowtop-postgres:
