# Local development database only. Staging and production use managed Postgres (see infra/).
#
#   docker compose up -d
#
# Settings come from backend/.env (Docker Compose reads it automatically); see .env.example.
# With nothing set, the password falls back to "localdev". That is fine only because
# the port is bound to 127.0.0.1, so nothing outside this machine can reach it.
#
# Host port 5433, not 5432, so it does not collide with another local Postgres.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowtop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: flowtop
    ports:
      - '127.0.0.1:${FLOWTOP_DB_PORT:-5433}:5432'
    volumes:
      - flowtop-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowtop -d flowtop']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  flowtop-postgres:
