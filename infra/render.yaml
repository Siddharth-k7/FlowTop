# Flowtop staging on Render: the API container and its managed Postgres.
# The two storage buckets live on Cloudflare R2 (see infra/README.md).
#
# Render reads this as a Blueprint. When creating it, set the Blueprint path to
# infra/render.yaml (Render looks at the repo root by default).
#
# No secret is written here. Values marked `sync: false` are entered in the
# Render dashboard when the Blueprint is created; MFA_ENCRYPTION_KEY is
# generated by Render once and never shown in the repo.

services:
  - type: web
    name: flowtop-api-staging
    runtime: docker
    region: singapore # closest Render region to India
    plan: starter # always on; the free plan sleeps and would make staging unreliable
    branch: main
    rootDir: backend
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Deploy only once every GitHub check on the commit has passed.
    autoDeployTrigger: checksPass
    # Only backend changes redeploy the API.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flowtop-staging-db
          property: connectionString # Render's internal network address
      - key: CORS_ORIGINS
        sync: false # comma-separated: the staging admin and public site URLs
      - key: ADMIN_URL
        sync: false # the staging admin URL, used in password reset and invite links
      - key: MFA_ENCRYPTION_KEY
        generateValue: true # 32 random bytes, base64. Never change it: MFA secrets would become unreadable.
      - key: TRUST_PROXY_HOPS
        value: '1' # Render's proxy, so rate limits see the real client IP
      - key: MEDIA_STORAGE_DRIVER
        value: s3
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false # the public R2 bucket's URL
      - key: S3_REGION
        value: auto # what R2 expects
      - key: S3_ENDPOINT
        sync: false # https://<account id>.r2.cloudflarestorage.com
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      - key: S3_PUBLIC_BUCKET
        value: flowtop-staging-public
      - key: S3_PRIVATE_BUCKET
        value: flowtop-staging-private
      - key: S3_ACCESS_KEY_ID
        sync: false # an R2 API token limited to the two staging buckets
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: flowtop-staging-db
    databaseName: flowtop
    user: flowtop
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: '17'
    # No address outside Render may connect. The API reaches it over Render's private network.
    ipAllowList: []
