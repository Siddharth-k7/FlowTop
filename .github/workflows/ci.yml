name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job must pass for a PR to merge (once they are required checks on main).
#
# - secret-scan:  no credential in any commit, and no .env file in the repo
# - backend:      install, typecheck, lint, unit tests, build, e2e tests, migration check
# - backend-image: the production Docker image still builds
# - frontend, admin, ui: one `npm ci` at the repo root (npm workspaces), then the app's
#   typecheck, lint, unit tests, build. Until an app has a package.json the job passes
#   with a "skipped" notice, then switches on by itself.

jobs:
  # Catches secrets from any clone, including one without the local pre-commit hook.
  # Uses the same rules and reviewed exceptions as the hook: .gitleaks.toml and .gitleaksignore.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not just the tip: a secret added and then deleted in the same PR is still leaked.
          fetch-depth: 0
          persist-credentials: false

      - name: No .env file committed
        run: |
          # .env.example (placeholders only) is the one allowed. Anything else named .env* is refused,
          # even if forced past .gitignore with `git add -f`.
          found=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::.env files must never be committed. Remove them and rotate every value they held:"
            echo "$found"
            exit 1
          fi
          echo "No .env file in the repo."

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan every commit
        run: gitleaks git --redact --no-banner --verbose .

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # A throwaway Postgres for the e2e tests, reachable only from this job and destroyed with it.
      # It uses trust auth, so there is no password to set, store or leak.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flowtop
          POSTGRES_DB: flowtop
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowtop -d flowtop"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://flowtop@localhost:5432/flowtop_test
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install, typecheck, lint, unit tests, build
        uses: ./.github/actions/node-app
        with:
          app: backend
          # Not an npm workspace yet: the Docker image Render deploys builds from backend/
          # alone and needs backend/package-lock.json.
          workspace: 'false'

      - name: E2E tests (real Postgres)
        working-directory: backend
        # The e2e setup creates the test database and applies every migration to it, from empty.
        run: npm run test:e2e

      - name: Migrations match the schema
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        # The database was just built from the migrations alone. If schema.prisma says anything
        # different, someone changed the schema without generating a migration.
        run: |
          if ! npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code; then
            echo "::error::schema.prisma and prisma/migrations are out of sync. Run 'npx prisma migrate dev --name <change>' and commit the migration."
            exit 1
          fi

  backend-image:
    name: Backend image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the production image Render deploys
        run: docker build --tag flowtop-api:ci backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-app
        with:
          app: frontend

  admin:
    name: Admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-app
        with:
          app: admin

  ui:
    name: UI kit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-app
        with:
          app: packages/ui
