name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per app. Each runs .github/actions/node-app (install, typecheck, lint,
# unit tests, build); any failing step fails the job and so the PR.
#
# To add frontend or admin once it has code, copy this block under `jobs:`:
#
#   frontend:
#     name: Frontend
#     runs-on: ubuntu-latest
#     timeout-minutes: 15
#     steps:
#       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
#         with:
#           persist-credentials: false
#       - uses: ./.github/actions/node-app
#         with:
#           app: frontend

jobs:
  # Catches secrets from any clone, including one without the local pre-commit hook.
  # Uses the same rules and reviewed exceptions as the hook: .gitleaks.toml and .gitleaksignore.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not just the tip: a secret added and then deleted in the same PR is still leaked.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan every commit
        run: gitleaks git --redact --no-banner --verbose .

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # A throwaway Postgres for the e2e tests, reachable only from this job and destroyed with it.
      # It uses trust auth, so there is no password to set, store or leak.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flowtop
          POSTGRES_DB: flowtop
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowtop -d flowtop"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install, typecheck, lint, unit tests, build
        uses: ./.github/actions/node-app
        with:
          app: backend

      - name: E2E tests (real Postgres)
        working-directory: backend
        env:
          # The e2e setup creates this database and applies every migration to it.
          TEST_DATABASE_URL: postgresql://flowtop@localhost:5432/flowtop_test
        run: npm run test:e2e
