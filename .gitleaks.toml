# Secret scanning rules for gitleaks, used by the pre-commit hook in .githooks/ and by CI.
# Gitleaks loads this file automatically when it scans the repo.
#
# This file deliberately contains no example secrets, not even in comments: other scanners
# (GitGuardian) read it too. Placeholders are recognised by shape, never by listing words.

title = "Flowtop gitleaks config"

# Start from the full built-in rule set (API keys, tokens, private keys, high-entropy strings).
[extend]
useDefault = true

# The built-in generic rule skips low-entropy values, so a short dictionary-word password
# assigned in a config file would get through. This rule catches any literal value there.
# It skips values that start with $ (an environment reference), < (a placeholder) or { .
# Limited to config-style files, because in source code the right-hand side is usually an identifier.
[[rules]]
id = "flowtop-password-literal-in-config"
description = "Password set to a literal value in a config file"
path = '''(?i)(\.(ya?ml|toml|ini|cfg|conf|properties|json)$|(^|/)\.env[^/]*$|(^|/)docker-compose[^/]*$)'''
# The key must start a line or follow whitespace, a quote or a comma; a key nested inside an
# environment reference with a default is therefore not read as an assignment.
# Spaces and tabs only around the separator, never a line break: an empty `KEY=` must not
# pick up the next line as its value.
regex = '''(?i)(?:^|[\s"',])[a-z0-9_]*(?:password|passwd|pwd)["']?[ \t]*[:=][ \t]*["']?([^\s"'`$<{#][^\s"'`#]{2,})'''
secretGroup = 1
keywords = ["password", "passwd", "pwd"]

# Deploy config (Render's render.yaml, Kubernetes-style env lists) names a variable on one
# line and gives its value on the next, so no single-line rule sees both. A variable whose
# name marks it as secret must never carry a literal `value:`: it belongs in the host's
# secret storage (Render: `sync: false`, `generateValue`, `fromDatabase`).
[[rules]]
id = "flowtop-secret-variable-with-literal-value"
description = "A secret-named variable given a literal value in deploy config"
path = '''(?i)\.ya?ml$'''
regex = '''(?i)-\s*(?:key|name):\s*["']?[a-z0-9_]*(?:secret|password|passwd|token|api_key|access_key|private_key|encryption_key|signing_key|database_url)[a-z0-9_]*["']?[ \t]*(?:#[^\n]*)?\r?\n\+?[ \t]*value:[ \t]*["']?([^\s"'#][^\s"'#]*)'''
secretGroup = 1
keywords = ["key:", "name:"]

# Credentials inside a connection string, in any file.
[[rules]]
id = "flowtop-connection-string-credentials"
description = "Password inside a database or broker connection string"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqps?)://[^:/\s"'`@]+:([^@\s"'`]+)@'''
secretGroup = 1
keywords = ["://"]

  [[rules.allowlists]]
  description = "Placeholders by shape: <...>, an interpolated ${...}, or a run of asterisks"
  regexTarget = "secret"
  regexes = ['''^(<[^>]+>|\$\{[^}]+\}|\*+)$''']

[[allowlists]]
# Render's render.yaml names each environment variable on a `- key:` line, with the value
# (if any) on the next line. A line that only names a variable, in capitals, holds no
# secret; the generic rule mistakes the name for a value. Values on any other line are
# still scanned, so a real secret in render.yaml is still caught.
description = "Environment variable names declared on their own line"
regexTarget = "line"
regexes = ['''^\s*-\s*key:\s*[A-Z][A-Z0-9_]*\s*(#.*)?$''']

[[allowlists]]
description = "Generated and vendored files"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)src/generated/''',
  '''(^|/)dist/''',
]
